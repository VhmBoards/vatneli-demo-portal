<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<title>VHM Admin Dashboard</title>
<style>
*{box-sizing:border-box;}
body{margin:0;font-family:"Segoe UI",sans-serif;background:radial-gradient(circle at top,#0a102a,#000);color:#fff;}
header{padding:20px;text-align:center;font-size:28px;font-weight:bold;background:linear-gradient(90deg,#00f2ff,#7b6cff);color:#000;text-shadow:0 0 10px #0ff;}
nav{display:flex;justify-content:center;gap:12px;margin:12px;}
nav button{padding:10px 14px;border:none;border-radius:8px;background:#00f2ff;color:#000;font-weight:700;cursor:pointer;transition:0.2s;}
nav button:hover{background:#0ff;}
section{display:none;padding:12px;}
section.active{display:block;}
.panel{background:rgba(18,26,55,0.92);border-radius:14px;padding:12px;box-shadow:0 0 45px #00f2ff55;}
.msg{display:flex;gap:8px;background:rgba(255,255,255,0.08);border-radius:12px;padding:8px;margin-bottom:8px;align-items:center;position:relative;}
.avatar{width:32px;text-align:center;}
.content span{color:#00f2ff;font-weight:600;}
.points{font-size:11px;color:#aaa;margin-left:auto;}
.delete{position:absolute;top:6px;right:8px;cursor:pointer;color:#ff4d4d;font-weight:bold;}
input, select, textarea, button{margin:4px 0;padding:8px;border-radius:8px;border:none;outline:none;}
button.send{background:#0ff;font-weight:700;color:#000;cursor:pointer;}
</style>
</head>
<body>

<header>VHM Admin Dashboard</header>
<nav>
  <button onclick="openPanel('registration')">Elevregistrering</button>
  <button onclick="openPanel('survey')">Elevundersøkelse</button>
  <button onclick="openPanel('chat')">Chat Wall</button>
  <button onclick="openPanel('leaderboard')">Leaderboard</button>
</nav>

<!-- Elevregistrering -->
<section id="registration" class="panel">
  <h2>Ny elevregistrering</h2>
  <div id="new-requests"></div>
</section>

<!-- Elevundersøkelse -->
<section id="survey" class="panel">
  <h2>Elevundersøkelse</h2>
  <div id="survey-responses"></div>
</section>

<!-- Chat wall -->
<section id="chat" class="panel">
  <h2>Chat Wall</h2>
  <div id="messages" style="max-height:400px;overflow-y:auto;"></div>
</section>

<!-- Leaderboard -->
<section id="leaderboard" class="panel">
  <h2>Leaderboard</h2>
  <div id="leaderboard-list"></div>
</section>

<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-storage-compat.js"></script>

<script>
// === Firebase Config ===
const firebaseConfig = {
  apiKey: "DIN_API_KEY",
  authDomain: "DITT_PROJECT_ID.firebaseapp.com",
  databaseURL: "https://DITT_PROJECT_ID-default-rtdb.firebaseio.com",
  projectId: "DITT_PROJECT_ID",
  storageBucket: "DITT_PROJECT_ID.appspot.com",
  messagingSenderId: "DIN_SENDER_ID",
  appId: "DIN_APP_ID"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const storage = firebase.storage();

// === Panels ===
function openPanel(panel){
  document.querySelectorAll('section.panel').forEach(sec=>sec.classList.remove('active'));
  document.getElementById(panel).classList.add('active');
}

// === Admin info ===
const ADMIN_NAME="Markuss";
const ADMIN_CODE="664242";

// === Elevregistrering ===
const newRequestsDiv=document.getElementById("new-requests");
db.ref('pendingUsers').on('value', snapshot=>{
  newRequestsDiv.innerHTML="";
  snapshot.forEach(snap=>{
    const user = snap.val();
    const key = snap.key;
    const div=document.createElement('div');
    div.innerHTML=`<p>Navn:${user.name}, Telefon:${user.phone}, Kode:${user.code}, Fødselsår:${user.birthYear}</p>
      <button id="accept-${key}">Accept</button>
      <button id="decline-${key}">Decline</button>`;
    newRequestsDiv.appendChild(div);

    document.getElementById(`accept-${key}`).onclick=()=>{
      if(user.birthYear>=2010){ alert("Elev er for ung!"); return; }
      db.ref('users/' + user.name).set({...user, accepted:true});
      db.ref('pendingUsers/' + key).remove();
    };
    document.getElementById(`decline-${key}`).onclick=()=>{ db.ref('pendingUsers/' + key).remove(); };
  });
});

// === Elevundersøkelse ===
const surveyDiv=document.getElementById("survey-responses");
db.ref('surveys').on('value', snapshot=>{
  surveyDiv.innerHTML="";
  snapshot.forEach(snap=>{
    const s=snap.val();
    const div=document.createElement('div');
    div.innerHTML=`<p>${s.name}: ${s.answer}</p>`;
    surveyDiv.appendChild(div);
  });
});

// === Chat ===
const messagesDiv=document.getElementById("messages");
let points={};

function isSuspiciousTime(){ 
  const now=new Date(); 
  const m=now.getHours()*60+now.getMinutes(); 
  return m>=540 && m<=870; // 09:00-14:30
}

db.ref('messages').on('value', snapshot=>{
  messagesDiv.innerHTML="";
  const msgs=[];
  snapshot.forEach(snap=>{
    const val=snap.val(); val.key=snap.key;
    msgs.push(val);
  });
  msgs.sort((a,b)=>b.timestamp-a.timestamp); // nyeste øverst
  msgs.forEach(m=>{
    const msg=document.createElement('div'); msg.className='msg';
    msg.innerHTML=`<div class="avatar">${m.avatar||"👤"}</div>
      <div class="content"><span>${m.name}:</span> ${m.text}<div class="points">⭐ ${m.pts||0}</div></div>`;
    // Admin kan slette
    const del=document.createElement('div'); del.className='delete'; del.textContent='✖';
    del.onclick=()=>{ db.ref('messages').child(m.key).remove(); };
    msg.appendChild(del);
    messagesDiv.appendChild(msg);
  });
});

// === Leaderboard ===
const leaderboardDiv=document.getElementById("leaderboard-list");
db.ref('users').on('value', snapshot=>{
  leaderboardDiv.innerHTML="";
  const arr=[];
  snapshot.forEach(snap=>{
    const u=snap.val();
    arr.push({name:u.name, pts:u.points||0});
  });
  arr.sort((a,b)=>b.pts-a.pts);
  arr.forEach(u=>{
    const div=document.createElement('div');
    div.innerHTML=`${u.name} - ⭐ ${u.pts}`;
    leaderboardDiv.appendChild(div);
  });
});
</script>

</body>
</html>
