<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Lag Avatar</title>
<style>
body {
  background:black;
  color:#00ffcc;
  font-family:monospace;
  text-align:center;
}
video, canvas {
  border:2px solid #00ffcc;
  border-radius:12px;
  margin:10px;
}
button {
  padding:10px;
  background:#00ffcc;
  border:none;
  font-weight:bold;
  cursor:pointer;
}
</style>
</head>
<body>

<h1>📸 Elev‑Avatar</h1>

<video id="video" width="240" autoplay></video><br>
<button onclick="snap()">Ta bilde</button><br>
<canvas id="canvas" width="240" height="180"></canvas><br>
<button onclick="save()">Lagre avatar</button>

<script>
const video = document.getElementById("video");
navigator.mediaDevices.getUserMedia({ video: true })
  .then(stream => video.srcObject = stream);

function snap(){
  const c = canvas.getContext("2d");
  c.drawImage(video,0,0,240,180);
}

function save(){
  localStorage.setItem("avatarImg", canvas.toDataURL());
  alert("Avatar lagret!");
}
</script>

</body>
</html>
