<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<title>Lag Avatar</title>
<style>
body{font-family:'Courier New',monospace;background:#0b0b0b;color:#00ffcc;padding:20px;text-align:center;}
h2{text-shadow:0 0 10px #00ffcc;}
input,select,button{margin:6px;padding:6px;background:black;color:#00ffcc;border:1px solid #00ffcc;}
button{cursor:pointer;transition:0.3s;}
button:hover{background:#00ffcc;color:black;}
#avatar{width:100px;height:100px;margin:20px auto;border:2px solid #00ffcc;border-radius:50%;background:#111;}
</style>
</head>
<body>

<h2>🎨 Lag Avatar</h2>

<label>Hårfarge: <input type="color" id="hair" value="#00ffcc"></label><br>
<label>Øyefarge: <input type="color" id="eyes" value="#00ffcc"></label><br>
<label>Hudfarge: <input type="color" id="skin" value="#222222"></label><br><br>
<button onclick="updateAvatar()">Oppdater Avatar</button>
<div id="avatar"></div>
<p>Din avatar lagres lokalt og brukes i chat</p>

<script>
function updateAvatar(){
  const hair=document.getElementById("hair").value;
  const eyes=document.getElementById("eyes").value;
  const skin=document.getElementById("skin").value;
  const avatar=document.getElementById("avatar");
  avatar.style.background=skin;
  avatar.style.boxShadow=`0 0 10px ${hair}, inset 0 0 5px ${eyes}`;
  localStorage.setItem("avatar",JSON.stringify({hair,eyes,skin}));
}
// last avatar
const av=JSON.parse(localStorage.getItem("avatar")||'{"hair":"#00ffcc","eyes":"#00ffcc","skin":"#222222"}');
document.getElementById("avatar").style.background=av.skin;
document.getElementById("avatar").style.boxShadow=`0 0 10px ${av.hair}, inset 0 0 5px ${av.eyes}`;
</script>

</body>
</html>
