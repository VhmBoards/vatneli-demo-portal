<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<title>Vatneli School – Firewall</title>
<style>
body {
  background:#0b0b0b;
  color:#00ff88;
  font-family:monospace;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}
.box {
  border:2px solid #00ff88;
  padding:20px;
  width:320px;
  text-align:center;
}
input {
  width:90%;
  margin:6px 0;
  padding:6px;
  background:black;
  color:#00ff88;
  border:1px solid #00ff88;
}
button {
  padding:6px 12px;
  background:#00ff88;
  color:black;
  border:none;
  cursor:pointer;
}
.msg { margin-top:10px; color:red; }
.small { font-size:12px; color:#aaa; }
</style>
</head>
<body>

<div class="box">
<h3>🔥 VATNELI FIREWALL 🔥</h3>
<p>Kun elever har tilgang</p>

<input id="name" placeholder="Navn">
<input id="code" type="password" placeholder="Tilgangskode">
<button onclick="login()">Authorize</button>

<div class="msg" id="msg"></div>
<p class="small">Fiktiv demo – skoleprosjekt</p>
</div>

<script>
function login(){
  const name = document.getElementById("name").value;
  const code = document.getElementById("code").value;

  if(name === "Markuss" && code === "664242"){
    localStorage.setItem("role","admin");
    location.href="admin.html";
    return;
  }

  if(code === "101110"){
    localStorage.setItem("role","student");
    localStorage.setItem("name",name);
    location.href="member.html";
  } else {
    document.getElementById("msg").innerText =
      "ACCESS DENIED BY FIREWALL";
  }
}
</script>

</body>
</html>
