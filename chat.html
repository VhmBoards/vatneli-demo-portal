<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<title>Vatneli Chatwall</title>

<style>
body {
  margin: 0;
  padding: 20px;
  font-family: "Courier New", monospace;
  background: linear-gradient(135deg, #070707, #111);
  color: #00ffcc;
  display: flex;
  flex-direction: column;
  align-items: center;
}

h1 {
  text-shadow: 0 0 10px #00ffcc;
}

textarea {
  width: 90%;
  max-width: 600px;
  height: 80px;
  background: #000;
  color: #00ffcc;
  border: 2px solid #00ffcc;
  padding: 10px;
  resize: none;
}

button {
  margin-top: 10px;
  padding: 10px 25px;
  background: #00ffcc;
  border: none;
  font-weight: bold;
  cursor: pointer;
  transition: 0.25s;
}

button:hover {
  background: black;
  color: #00ffcc;
  box-shadow: 0 0 20px #00ffcc;
}

#chat {
  width: 90%;
  max-width: 600px;
  margin-top: 25px;
}

.msg {
  display: flex;
  gap: 12px;
  background: rgba(0,0,0,0.65);
  border: 2px solid #00ffcc;
  border-radius: 14px;
  padding: 12px;
  margin-bottom: 12px;
  animation: glow 1.5s infinite alternate;
}

.avatar {
  width: 48px;
  height: 48px;
  border-radius: 50%;
  border: 2px solid #00ffcc;
  flex-shrink: 0;
  object-fit: cover;
}

@keyframes glow {
  from { box-shadow: 0 0 6px #00ffcc; }
  to   { box-shadow: 0 0 18px #00ffcc; }
}

small {
  color: #aaa;
}

#points {
  margin-top: 15px;
}
</style>
</head>

<body>

<h1>💬 Vatneli Chatwall</h1>
<p>Kun medlemmer • Nyeste melding vises øverst</p>

<label>
  <input type="checkbox" id="anon">
  Post anonymt
</label><br><br>

<textarea id="text" placeholder="Skriv melding..."></textarea><br>
<button onclick="send()">Send</button>

<div id="points"></div>
<div id="chat"></div>

<script>
// ================== SIKKERHET ==================
if (!localStorage.getItem("role")) {
  document.body.innerHTML = "<h2>ACCESS DENIED</h2>";
}

// ================== AVATAR ==================
function getAvatar() {
  const img = localStorage.getItem("avatarImg");
  if (img) {
    return { type: "img", src: img };
  }
  return { type: "color", bg: "#222", border: "#00ffcc" };
}

// ================== SUSPICIOUS TIME ==================
function suspiciousTime() {
  const d = new Date();
  const h = d.getHours();
  const m = d.getMinutes();

  const inTime =
    (h === 9 && m >= 0) ||
    (h > 9 && h < 14) ||
    (h === 14 && m <= 30);

  return inTime && localStorage.getItem("role") !== "admin";
}

// ================== POENG ==================
function addPoints(n) {
  let p = parseInt(localStorage.getItem("points") || "0");
  p += n;
  localStorage.setItem("points", p);
  document.getElementById("points").innerText = "⭐ Poeng: " + p;
}

// ================== LAST CHAT ==================
function loadChat() {
  const chat = document.getElementById("chat");
  chat.innerHTML = "";

  const msgs = JSON.parse(localStorage.getItem("chat") || "[]");

  // 🔥 NYESTE ØVERST
  msgs.slice().reverse().forEach(m => {
    const div = document.createElement("div");
    div.className = "msg";

    let avatarHTML = "";
    if (m.avatar.type === "img") {
      avatarHTML = `<img class="avatar" src="${m.avatar.src}">`;
    } else {
      avatarHTML = `<div class="avatar" style="background:${m.avatar.bg};"></div>`;
    }

    div.innerHTML = `
      ${avatarHTML}
      <div>
        <b>${m.name}</b><br>
        ${m.text}<br>
        <small>${m.time}</small>
      </div>
    `;
    chat.appendChild(div);
  });
}

// ================== SEND MELDING ==================
function send() {
  if (suspiciousTime()) {
    alert("⚠️ Begrenset tilgang mellom 09:00–14:30");
    return;
  }

  const text = document.getElementById("text").value.trim();
  if (!text) return;

  const anon = document.getElementById("anon").checked;
  const name = anon ? "Anonym elev" : (localStorage.getItem("name") || "Elev");

  const msg = {
    name,
    text,
    time: new Date().toLocaleString(),
    avatar: getAvatar()
  };

  const msgs = JSON.parse(localStorage.getItem("chat") || "[]");
  msgs.push(msg);
  localStorage.setItem("chat", JSON.stringify(msgs));

  document.getElementById("text").value = "";
  addPoints(5);
  loadChat();
}

// ================== INIT ==================
document.getElementById("points").innerText =
  "⭐ Poeng: " + (localStorage.getItem("points") || "0");

loadChat();
</script>

</body>
</html>
