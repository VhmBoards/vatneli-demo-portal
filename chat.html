<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<title>Elev Chatwall</title>
<style>
body { font-family: Arial; background:#eef; padding:20px; }
.box { background:white; padding:10px; margin-bottom:10px; border-radius:6px; }
small { color:#666; }
</style>
</head>
<body>

<h2>💬 Elev Chatwall</h2>
<p>Kun for elever – fiktiv demo</p>

<label>
  <input type="checkbox" id="anon">
  Post anonymt
</label>
<br><br>

<textarea id="msg" rows="3" cols="40" placeholder="Skriv melding..."></textarea><br><br>
<button onclick="post()">Send</button>

<hr>

<div id="chat"></div>

<script>
// enkel tilgangssjekk
if(!localStorage.getItem("role")){
  document.body.innerHTML = "ACCESS DENIED BY FIREWALL";
}

/* --- last meldinger --- */
function load(){
  const chat = document.getElementById("chat");
  chat.innerHTML = "";
  const msgs = JSON.parse(localStorage.getItem("chat") || "[]");
  msgs.forEach(m=>{
    chat.innerHTML += `
      <div class="box">
        <b>${m.name}</b>: ${m.text}<br>
        <small>${m.time}</small>
      </div>`;
  });
}

function post(){
  const text = document.getElementById("msg").value;
  if(!text) return;

  const anon = document.getElementById("anon").checked;
  const name = anon ? "Anonym elev" : (localStorage.getItem("name") || "Elev");

  let msgs = JSON.parse(localStorage.getItem("chat") || "[]");
  msgs.push({
    name,
    text,
    time: new Date().toLocaleString()
  });

  localStorage.setItem("chat", JSON.stringify(msgs));
  document.getElementById("msg").value = "";
  load();
}

load();
</script>

</body>
</html>
