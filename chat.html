<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <title>Elev Chat</title>

  <style>
    body {
      margin: 0;
      background: radial-gradient(circle at top, #0a0f1f, #000);
      font-family: "Segoe UI", sans-serif;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .chat-box {
      width: 420px;
      height: 600px;
      background: rgba(20, 30, 60, 0.85);
      border-radius: 18px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 0 40px #00f2ff44;
      overflow: hidden;
    }

    .header {
      padding: 14px;
      text-align: center;
      font-weight: bold;
      letter-spacing: 1px;
      background: linear-gradient(90deg, #00f2ff, #6a5cff);
      color: black;
    }

    .messages {
      flex: 1;
      padding: 10px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
    }

    .msg {
      background: rgba(255,255,255,0.08);
      border-radius: 10px;
      padding: 8px 10px;
      margin-bottom: 8px;
      font-size: 14px;
      animation: slideIn 0.3s ease-out;
    }

    .msg span {
      color: #00f2ff;
      font-weight: bold;
    }

    .input-area {
      display: flex;
      padding: 10px;
      gap: 6px;
      background: #050814;
    }

    input {
      flex: 1;
      padding: 8px;
      border-radius: 8px;
      border: none;
      outline: none;
    }

    button {
      padding: 8px 14px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      background: #00f2ff;
      font-weight: bold;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(-15px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>

<body>

<div class="chat-box">
  <div class="header">💬 Elev Chat</div>

  <div class="messages" id="messages"></div>

  <div class="input-area">
    <input id="name" placeholder="Navn">
    <input id="text" placeholder="Melding">
    <button onclick="send()">Send</button>
  </div>
</div>

<script>
  const messagesDiv = document.getElementById("messages");

  function send() {
    const name = document.getElementById("name").value || "Anonym";
    const text = document.getElementById("text").value;
    if (!text) return;

    const msg = document.createElement("div");
    msg.className = "msg";
    msg.innerHTML = "<span>" + name + ":</span> " + text;

    // 🔥 NYESTE MELDING ØVERST
    messagesDiv.prepend(msg);

    document.getElementById("text").value = "";
  }
</script>

</body>
</html>
